name: PulsEdge news

# Every 15 minutes from 08:15 to 16:00 IST, Mon–Fri, and once more at 19:20 IST, plus manual runs.
# On master: collect -> classify -> commit pulsedge/data/feed.json -> deploy the site -> post to Telegram.
# The 19:20 IST run (after NSE publishes closing prices) also posts the evening summary, renders the daily
# reel and publishes it to the "daily-reel" release; run it by hand with reel: true.
#
# Timing: GitHub's cron ran this workflow hours late, or not at all, so the cron lines below only start
# the day. Each run on master then books the next one itself: the "next" job waits for the next slot
# (pulsedge-bot/next_slot.py) and starts the workflow again. Late cron runs can't post at night: the bot
# keeps quiet from 22:00 to 07:00 IST, and the summary and reel only go out in the evening.
# On any other branch (push): a dry run that fetches and classifies but changes nothing; reel changes
# render a test reel as a workflow artifact.
on:
  schedule:
    # minutes away from :00/:15/:30/:45, when GitHub is busiest
    - cron: '23 21-23 * * 0-4'          # 02:53–04:53 IST: waits for the 08:15 slot
    - cron: '23 0-1 * * 1-5'            # 05:53 and 06:53 IST
    - cron: '38 2-10 * * 1-5'            # 08:08–16:08 IST, hourly: restarts the chain if it ever stops
    - cron: '53 13 * * 1-5'             # 19:23 IST: backup for the evening run
  workflow_dispatch:
    inputs:
      reel:
        description: 'Render and publish the daily reel'
        type: boolean
        default: false
      force:
        description: 'Make the reel even if today already has one, the market was closed, or it is before 4 pm IST'
        type: boolean
        default: false
      digest:
        description: "Post today's evening summary to Telegram now"
        type: boolean
        default: false
  push:
    branches-ignore:
      - master
    paths:
      - 'pulsedge-bot/news_pipeline.py'
      - 'pulsedge-bot/sources.json'
      - 'pulsedge-bot/premarket.py'
      - 'pulsedge-bot/track_record.py'
      - 'pulsedge-bot/news_calendar.py'
      - 'pulsedge-bot/events.py'
      - 'pulsedge-bot/flows.py'
      - 'pulsedge-bot/reports.py'
      - 'pulsedge-bot/reel/**'
      - '.github/workflows/pulsedge-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  models: read
  actions: write    # the update job starts the RedBox fast lane (pulsedge-fast.yml) when it isn't running

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # one update at a time per branch; the long wait in "next" stays outside this group so it never blocks a run
    concurrency:
      group: pulsedge-news-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install --quiet "anthropic>=0.70"
    - name: Collect and classify
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        PULSEDGE_MODEL: ${{ vars.PULSEDGE_MODEL }}
        GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PULSEDGE_USE_GITHUB_MODELS: ${{ vars.PULSEDGE_USE_GITHUB_MODELS }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        AI_MODEL: ${{ vars.AI_MODEL }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        PULSEDGE_GH_MODEL: ${{ vars.PULSEDGE_GH_MODEL }}
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
      run: python pulsedge-bot/news_pipeline.py $DRY
    - name: Institutional flows
      timeout-minutes: 3
      env:
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
      run: python pulsedge-bot/flows.py $DRY
    - name: AI reports
      # plain-English reports for the terminal's search; a failure here never stops the update
      timeout-minutes: 4
      continue-on-error: true
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
      run: python pulsedge-bot/reports.py $DRY
    - name: Pre-market panel
      timeout-minutes: 4
      env:
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
      # --if-stale: while the fast lane is refreshing premarket.json every few minutes, this run leaves it alone
      run: |
        python pulsedge-bot/premarket.py $DRY --if-stale 300 > "$RUNNER_TEMP/premarket.out"
        head -c 3000 "$RUNNER_TEMP/premarket.out"
    - name: Track record
      timeout-minutes: 4
      env:
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
      run: python pulsedge-bot/track_record.py $DRY
    - name: News calendar
      # each day's stories and the closes calendar.html needs (after the track record, which updates the closes)
      timeout-minutes: 2
      continue-on-error: true
      env:
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
      run: python pulsedge-bot/news_calendar.py update $DRY
    - name: Upcoming events
      # results dates, board meetings and ex-dates from NSE (at most every 3 hours), and RBI, Fed, Budget and expiry dates
      timeout-minutes: 2
      continue-on-error: true
      env:
        DRY: ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }}
        FORCE: ${{ github.ref != 'refs/heads/master' && '--force' || '' }}   # branch test runs always ask the sources (nothing is written)
      run: python pulsedge-bot/events.py update $DRY $FORCE
    - name: Commit new headlines
      id: commit
      if: github.ref == 'refs/heads/master'
      run: |
        FILES="pulsedge/data/feed.json pulsedge/data/universe.json pulsedge/data/premarket.json pulsedge/data/live.json pulsedge/data/track.json pulsedge/data/flows.json pulsedge/data/reports.json pulsedge/data/paper.json pulsedge/data/newscal pulsedge/data/events.json pulsedge-bot/state"
        FILES=$(for f in $FILES; do [ -e "$f" ] && echo "$f"; done)
        if [ -n "$(git status --porcelain $FILES)" ]; then
          git config user.name "pulsedge-bot"
          git config user.email "pulsedge-bot@users.noreply.github.com"
          git add $FILES
          git commit -q -m "PulsEdge news: $(date -u +%Y-%m-%dT%H:%MZ)"
          # the fast lane pushes fast.json and, every few minutes, premarket.json and live.json (this run skips those two
          # while the fast lane is refreshing them); on a clash over them this run's copy wins and the next refresh replaces it
          ok=""
          for i in 1 2 3 4; do
            if git push -q; then ok=1; break; fi
            git pull --rebase -X theirs -q origin master || git rebase --abort || true
            sleep "$i"
          done
          [ -n "$ok" ] || { echo "push failed four times"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Keep the RedBox fast lane running
      if: github.ref == 'refs/heads/master' && github.event_name != 'push'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        HM=$(TZ=Asia/Kolkata date +%H%M)
        if [ "$HM" -lt 700 ] || [ "$HM" -ge 1550 ]; then echo "Outside the fast lane's hours."; exit 0; fi
        n=$(gh api "repos/$REPO/actions/workflows/pulsedge-fast.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
        if [ "$n" = "0" ]; then gh workflow run pulsedge-fast.yml --repo "$REPO" --ref master && echo "Started the fast lane."; else echo "Fast lane running."; fi
    - name: Make sure last month's report draft exists
      # the monthly workflow's schedule can be skipped by GitHub; on the 1st-3rd this run starts it if it hasn't run
      if: github.ref == 'refs/heads/master' && github.event_name != 'push'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        D=$(TZ=Asia/Kolkata date +%-d)
        if [ "$D" -gt 3 ]; then exit 0; fi
        M=$(TZ=Asia/Kolkata date -d "$(TZ=Asia/Kolkata date +%Y-%m-01) -1 day" +%Y-%m)
        # done when the report is published or was written after the month ended (a mid-month preview doesn't count)
        if python3 -c "import json,sys;r=json.load(open('pulsedge/data/monthly/$M.json'));sys.exit(0 if r.get('status')=='published' or r.get('generated','')[:7]>'$M' else 1)" 2>/dev/null; then echo "Report for $M exists."; exit 0; fi
        busy=$(gh api "repos/$REPO/actions/workflows/pulsedge-monthly.yml/runs?per_page=5" --jq '[.workflow_runs[] | select(.status != "completed" or (.created_at > (now - 7200 | todate)))] | length')
        if [ "$busy" = "0" ]; then gh workflow run pulsedge-monthly.yml --repo "$REPO" --ref master && echo "Started the $M report."; else echo "The report job ran or is running."; fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pulsedge-pages
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        persist-credentials: false
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pulsedge
    - name: Wait until GitHub lists the upload
      # deploy-pages looks the upload up straight away, and GitHub sometimes lists it a few seconds late; the deploy
      # then fails with "No artifacts named github-pages were found" (it did on 25 Nov 2026, again and again)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for i in $(seq 1 30); do
          n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length' 2>/dev/null || echo 0)
          if [ "$n" != "0" ]; then echo "Listed after $(( (i-1)*3 )) s"; exit 0; fi
          sleep 3
        done
        echo "Not listed after 90 s; deploying anyway"
    - id: deployment
      uses: actions/deploy-pages@v4
      continue-on-error: true
    - name: Wait a little before trying again
      if: steps.deployment.outcome == 'failure'
      run: sleep 20
    - name: Deploy again if that failed
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v4

  # Same update to the Cloudflare copy (https://pulsedge.pages.dev); a no-op until its secrets exist.
  cloudflare:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    concurrency:
      group: pulsedge-cloudflare
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Copy the site to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        COMMIT_MESSAGE: news update
      run: bash pulsedge-bot/cf_pages.sh

  telegram:
    needs: update
    if: >-
      github.ref == 'refs/heads/master'
      && (needs.update.outputs.changed == 'true' || github.event.schedule == '53 13 * * 1-5' || inputs.digest)
    runs-on: ubuntu-24.04
    env:
      # PulsEdge Premium: set TELEGRAM_PRO_CHAT_ID (a private channel's id, -100...) and alerts go there first; the
      # public channel then gets the morning brief, a few delayed alerts and the evening summary (see pulse_bot.py)
      TELEGRAM_PRO_CHAT_ID: ${{ vars.TELEGRAM_PRO_CHAT_ID }}
      PULSEDGE_PREMIUM_URL: ${{ vars.PULSEDGE_PREMIUM_URL }}
      PULSEDGE_YOUTUBE_URL: ${{ vars.PULSEDGE_YOUTUBE_URL }}
      PULSEDGE_FREE_PER_DAY: ${{ vars.PULSEDGE_FREE_PER_DAY }}
      PULSEDGE_FREE_DELAY_MIN: ${{ vars.PULSEDGE_FREE_DELAY_MIN }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: master
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install --quiet pillow==10.4.0
    - name: Morning brief
      # once a trading day, 08:15-09:20 IST: GIFT Nifty's opening indication and the checklist, to both channels
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      run: python pulse_bot.py brief
      working-directory: pulsedge-bot
    - name: Post new Act signals
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      run: python pulse_bot.py post
      working-directory: pulsedge-bot
    - name: Post market-moving news
      # the most important global and economy/policy stories, up to 3 per message and 8 a day
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      run: python pulse_bot.py news
      working-directory: pulsedge-bot
    - name: Free channel preview
      # premium mode only: one Act card members got at least 30 minutes ago, up to 3 a day
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      run: python pulse_bot.py teaser
      working-directory: pulsedge-bot
    - name: Evening summary
      if: github.event.schedule == '53 13 * * 1-5' || inputs.digest
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      # a run that asks for the summary by input may post it at any hour; a late cron run may not
      run: python pulse_bot.py digest ${{ inputs.digest && '--any-hour' || '' }}
      working-directory: pulsedge-bot
    - name: Remember what was posted
      run: |
        files="pulsedge-bot/posted.json pulsedge-bot/state/posted_at.json pulsedge-bot/state/free_posted.json"
        if [ -n "$(git status --porcelain $files)" ]; then
          git config user.name "pulsedge-bot"
          git config user.email "pulsedge-bot@users.noreply.github.com"
          git add $(ls $files 2>/dev/null)
          git commit -q -m "PulsEdge bot: record posted events"
          git pull --rebase -q && git push
        fi

  reel:
    needs: update
    # evening schedule or a manual run with reel: true on master; any push that reaches this workflow on another branch
    if: >-
      (github.ref == 'refs/heads/master' && (github.event.schedule == '53 13 * * 1-5' || inputs.reel))
      || (github.ref != 'refs/heads/master' && github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' && '1' || '' }}
      FORCE: ${{ inputs.force && '1' || '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.ref == 'refs/heads/master' && 'master' || github.sha }}
    - name: Market day, and no reel yet today?
      id: gate
      run: |
        DAY=$(TZ=Asia/Kolkata date +%F)
        echo "day=$DAY" >> "$GITHUB_OUTPUT"
        GO=$(python3 - "$DAY" <<'PY'
        import json, sys, datetime
        day = sys.argv[1]
        hol = set(json.load(open("pulsedge/data/calendar.json")).get("holidays", []))
        print("no" if datetime.date.fromisoformat(day).weekday() >= 5 or day in hol else "yes")
        PY
        )
        if [ "$GO" = no ] && [ -z "$FORCE" ] && [ -n "$PUBLISH" ]; then echo "NSE closed on $DAY; no reel."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
        # a cron run that GitHub delivers after midnight must not make "today's" reel from yesterday's close
        if [ -n "$PUBLISH" ] && [ -z "$FORCE" ] && [ "$(TZ=Asia/Kolkata date +%-H)" -lt 16 ]; then
          echo "Before 4 pm IST: today's closing prices aren't out yet; no reel."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ -n "$PUBLISH" ] && [ -z "$FORCE" ] && gh release view daily-reel --json assets -q '.assets[].name' 2>/dev/null | grep -qx "pulsedge-reel-$DAY.mp4"; then
          echo "Today's reel is already published."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "go=true" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      if: steps.gate.outputs.go == 'true'
      with:
        node-version: '20'
    - name: Install the renderer
      if: steps.gate.outputs.go == 'true'
      timeout-minutes: 6
      # GitHub's Ubuntu image already has Google Chrome; only the small playwright-core driver is needed
      run: |
        npm i --no-save --no-audit --no-fund playwright-core@1.48.2
        CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
        echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"; echo "Chrome: $CHROME"
        command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
        ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264 && echo "ffmpeg with libx264 ready"
    - name: Render the reel
      if: steps.gate.outputs.go == 'true'
      timeout-minutes: 8
      run: node pulsedge-bot/reel/render.js --out "out/pulsedge-reel-${{ steps.gate.outputs.day }}.mp4"
    - name: Keep the test reel (branches)
      if: steps.gate.outputs.go == 'true' && env.PUBLISH != '1'
      uses: actions/upload-artifact@v4
      with:
        name: pulsedge-reel-test
        path: out/
    - name: Publish to the daily-reel release
      if: steps.gate.outputs.go == 'true' && env.PUBLISH == '1'
      env:
        DAY: ${{ steps.gate.outputs.day }}
        REPO: ${{ github.repository }}
      run: |
        cd out
        for f in pulsedge-reel-$DAY*; do cp "$f" "${f/$DAY/latest}"; done
        BASE="https://github.com/$REPO/releases/download/daily-reel"
        { echo "Latest reel: **$DAY**. Download: [video]($BASE/pulsedge-reel-latest.mp4) · [cover]($BASE/pulsedge-reel-latest-cover.jpg)"; echo
          echo "### Caption"; echo; echo '```'; cat "pulsedge-reel-$DAY-caption.txt"; echo '```'; echo
          echo "### Voice-over script"; echo; echo '```'; cat "pulsedge-reel-$DAY-voiceover.txt"; echo '```'; } > ../notes.md
        gh release view daily-reel >/dev/null 2>&1 || gh release create daily-reel --title "PulsEdge daily reel" --notes "Daily reels, made after the market closes." --latest=false
        gh release upload daily-reel pulsedge-reel-* --clobber
        gh release edit daily-reel --notes-file ../notes.md
        # keep 30 days of dated reels
        CUT=$(date -d "$DAY -30 days" +%F)
        gh release view daily-reel --json assets -q '.assets[].name' | while read -r n; do
          d=$(echo "$n" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' || true)
          if [ -n "$d" ] && [[ "$d" < "$CUT" ]]; then gh release delete-asset daily-reel "$n" -y; fi
        done
        { echo "### Today's reel"; echo; echo "- [Video]($BASE/pulsedge-reel-latest.mp4)"; echo "- [Release page](https://github.com/$REPO/releases/tag/daily-reel)"; } >> "$GITHUB_STEP_SUMMARY"
    - name: Send to Telegram
      if: steps.gate.outputs.go == 'true' && env.PUBLISH == '1'
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ vars.TELEGRAM_REEL_CHAT_ID }}
        DAY: ${{ steps.gate.outputs.day }}
      run: |
        if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram not set up (TELEGRAM_BOT_TOKEN secret, TELEGRAM_REEL_CHAT_ID variable); skipping."; exit 0; fi
        curl -sf -o /dev/null -F chat_id="$TG_CHAT" -F supports_streaming=true -F video=@"out/pulsedge-reel-$DAY.mp4" \
          -F caption="$(head -c 1000 "out/pulsedge-reel-$DAY-caption.txt")" "https://api.telegram.org/bot$TG_TOKEN/sendVideo" && echo "Sent to Telegram."

  next:
    # Books the next run (see the note at the top). Only the newest run on master keeps the chain, so a cron
    # run or a manual run that arrives while this one waits simply takes over.
    needs: update
    if: always() && github.ref == 'refs/heads/master' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
    - uses: actions/checkout@v5
      with:
        sparse-checkout: pulsedge-bot/next_slot.py
        sparse-checkout-cone-mode: false
    - name: Wait for the next slot, then start the next run
      run: |
        newer() {
          gh api "repos/$REPO/actions/workflows/pulsedge-news.yml/runs?branch=master&per_page=30" \
            --jq "[.workflow_runs[] | select(.id > $RUN_ID and .status != \"completed\")] | length" 2>/dev/null || echo 0
        }
        if [ "$(newer)" != "0" ]; then echo "A newer run is active; it books the next slot."; exit 0; fi
        read -r AT KIND < <(python3 pulsedge-bot/next_slot.py) || true
        if [ -z "${AT:-}" ]; then echo "No slot in the next few hours; a cron run starts the next day."; exit 0; fi
        echo "Next run: $(TZ=Asia/Kolkata date -d "@$AT" '+%a %H:%M IST') ($KIND)"
        while :; do
          LEFT=$(( AT - $(date +%s) ))
          if [ "$LEFT" -le 0 ]; then break; fi
          sleep $(( LEFT < 240 ? LEFT : 240 ))
          if [ "$(newer)" != "0" ]; then echo "A newer run took over."; exit 0; fi
        done
        if [ "$KIND" = evening ]; then
          gh workflow run pulsedge-news.yml --repo "$REPO" --ref master -f reel=true -f digest=true
        else
          gh workflow run pulsedge-news.yml --repo "$REPO" --ref master
        fi
        echo "Started the $KIND run."
