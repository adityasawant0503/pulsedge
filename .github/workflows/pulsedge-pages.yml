name: PulsEdge site

on:
  push:
    branches:
      - master
    paths:
      - 'pulsedge/**'
      - '.github/workflows/pulsedge-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pulsedge-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pulsedge
    - id: deployment
      uses: actions/deploy-pages@v4

  # Second copy at https://pulsedge.pages.dev (free, short address for the bio); does nothing until the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist. See pulsedge-bot/cf_pages.sh.
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pulsedge-cloudflare
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Copy the site to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: bash pulsedge-bot/cf_pages.sh
