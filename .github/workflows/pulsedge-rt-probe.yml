name: PulsEdge real-time probe (temporary)
on:
  push:
    branches-ignore: [master]
    paths: ['pulsedge-bot/rt_probe.py', '.github/workflows/pulsedge-rt-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
    - run: python3 pulsedge-bot/rt_probe.py
