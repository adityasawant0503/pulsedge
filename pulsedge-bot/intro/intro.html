<title>PulsEdge intro</title>
<!-- The PulsEdge intro video, drawn frame by frame: render.js calls init(data) once, then render(t) for every frame.
     Scenes: headlines stream in (0-6 s), PulsEdge sorts them into Act / Watch / Ignore (6-14.5), one real item with
     its plain-English reason (14.5-20.5), a three-step tour of the real terminal in 3D (20.5-43.5), Simple and Pro
     (43.5-48), end card (48-54). Everything is a pure function of t, so any frame can be rendered on its own. -->
<style>

<body>
<div id="bg"></div>
<div id="floorwrap"><div id="floor"></div></div>
<div id="world"></div>
<div id="gatewrap" class="abs"></div>
<div id="exwrap"><div id="ex"></div></div>
<div id="stage"><div id="plane"></div></div>
<div id="duo"></div>
<div id="shade"></div>
<div id="legend"></div>
<div id="caps"></div>
<div id="end"></div>
<div id="brand"><i></i>PulsEdge</div>
<script>
var INTRO={duration:54,poster:11.9};
var D=null,$=function(id){return document.getElementById(id)};
function C(v,a,b){return Math.min(b,Math.max(a,v))}
function P(t,a,b){return C((t-a)/(b-a),0,1)}
function E(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function EO(x){return 1-Math.pow(1-x,3)}
function L(a,b,x){return a+(b-a)*x}
function win(t,a,b,f){f=f||.45;return Math.min(P(t,a,a+f),1-P(t,b-f,b))}
function mk(tag,cls,text,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var LABEL={act:"ACT",watch:"WATCH",ignore:"IGNORE"};
var stream=[],sorted=[],caps=[],rings=[],layers={},cursor,ripples=[],keys=[],cpath=[],duo={},endEl={};

function init(d){
  D=d;var r=rnd(7),w=$("world");
  // scene A: headlines flying at the viewer
  d.stream.slice(0,30).forEach(function(text,i){
    var e=mk("div","hc",null,w);mk("span",null,text,e);
    var y=-260+r()*700,x=(r()*2-1)*860;if(Math.abs(x)<300&&y<-120)y+=260;
    stream.push({e:e,x:x,y:y,s:-3.6+i*.34,ry:(r()*2-1)*10});
  });
  // scene B: the same kind of headlines, sorted through the gate
  var counts={act:0,watch:0,ignore:0};
  d.sort.forEach(function(it,j){
    var e=mk("div","hc",null,w),chip=mk("span","chip c-"+it.call,LABEL[it.call],e);mk("span",null,it.text,e);
    var a=r()*Math.PI*2;
    sorted.push({e:e,chip:chip,call:it.call,k:counts[it.call]++,g:7.5+j*.5,sx:Math.cos(a)*760,sy:Math.sin(a)*330,dx:(r()*2-1)*260});
  });
  var gw=$("gatewrap"),gate=mk("div",null,null,gw);gate.id="gate";mk("div","gl","PULSEDGE READS IT",gate);var scan=mk("div","scan",null,gate);
  sorted.gate=gate;sorted.scan=scan;
  var lg=$("legend");[["act","worth reading now"],["watch","keep an eye on it"],["ignore","routine, safe to skip"]].forEach(function(l){
    var row=mk("div",null,null,lg);mk("span","chip c-"+l[0],LABEL[l[0]],row);mk("span",null,l[1],row)});
  // scene C: one real item with its reason
  var ex=$("ex"),ec=mk("div","card",null,ex),x=d.example||{text:"",why:"",check:"",sym:"",source:"",date:""};
  var r1=mk("div","row1",null,ec);mk("span","chip c-watch","WATCH · keep an eye on it",r1);if(x.sym)mk("span","sym",x.sym,r1);
  mk("h3",null,x.text,ec);
  var w1=mk("div",null,null,ec);mk("div","lab","WHY IT MATTERS",w1);mk("div","txt",x.why,w1);
  var w2=mk("div",null,null,ec);mk("div","lab","WHAT TO CHECK",w2);mk("div","txt",x.check,w2);
  var ft=mk("div","foot","Real example"+(x.date?" from "+x.date:"")+(x.source?" · Source: "+x.source:""),ec);
  ex.parts=[w1,w2,ft];
  // the real terminal, as one plane the camera moves over
  var m=d.meta,pl=$("plane"),n=m.typing.n;
  ["feed"].concat(Array.from({length:n},function(_,i){return "typing"+(i+1)})).concat(["brief","added","mine","chat"]).forEach(function(k){
    var im=mk("img",null,null,pl);im.src=d.shots+k+".png";layers[k]=im});
  function ctr(b){return {x:b.x+b.w/2,y:b.y+b.h/2}}
  function ring(b,a,z,pad){var e=mk("div","ring",null,pl);pad=pad||7;e.style.left=(b.x-pad)+"px";e.style.top=(b.y-pad)+"px";e.style.width=(b.w+pad*2)+"px";e.style.height=(b.h+pad*2)+"px";rings.push({e:e,a:a,b:z})}
  var se=m.feed.search,ai=m.brief.ai,ad=m.brief.add,tb=m.mine.tab,fc=m.mine.first,ch=m.chat.chat,an=m.chat.answer,q1=m.typing.first;
  ring(se,25.0,27.3);if(q1)ring(q1,26.3,27.3,4);ring(ai,28.3,31.4,10);ring(m.added.add||ad,32.95,34.2,6);ring(tb,35.0,37.5,5);if(fc)ring(fc,35.5,37.5,4);
  if(m.chat.question)ring(m.chat.question,38.4,43.3,6);ring(an,38.9,43.3,6);
  var O={cx:720,cy:440,z:.8,rx:6,ry:-14,dy:0},sc=ctr(se),bc=ctr(ad),cc=ctr(ch);
  // frame a region of the screen (x0,y0)-(x1,y1) in the free area right of the captions (about 1150 x 900 px)
  function fit(x0,y0,x1,y1,rx,ry,max){return {cx:(x0+x1)/2,cy:(y0+y1)/2,z:Math.min(max||1.3,1150/(x1-x0),880/(y1-y0)),rx:rx,ry:ry,dy:0}}
  var vw=m.feed.view||se,S=fit(se.x-20,se.y-50,vw.x+vw.w+20,(q1?q1.y+q1.h*2.2:se.y+170),3,-8);
  var A=fit(ai.x-20,ai.y-150,ai.x+ai.w+20,ai.y+ai.h+20,4,-9,1.25),B=fit(m.brief.brief.x-10,m.brief.brief.y-10,ad.x+ad.w+40,ai.y+120,3,-8,1.45);
  var M=fit(fc?fc.x-20:tb.x-600,tb.y-30,fc?fc.x+fc.w+20:tb.x+tb.w+40,fc?fc.y+fc.h+180:tb.y+500,5,-10,1.3),Ch=fit(ch.x-20,ch.y-20,ch.x+ch.w+20,ch.y+ch.h+20,3,-12,1.3);
  keys=[[22.2,{cx:720,cy:450,z:.3,rx:40,ry:-30,dy:420}],[23.6,O],[24.4,O],[25.2,S],[27.4,S],[28.4,A],[31.4,A],[32.3,B],[34.1,B],[34.7,M],[37.5,M],[38.3,Ch],[43.2,Ch],[44.1,{cx:720,cy:450,z:.45,rx:12,ry:-22,dy:120}]];
  cursor=mk("div",null,null,pl);cursor.id="cursor";
  cursor.innerHTML='<svg viewBox="0 0 30 40" width="30" height="40"><path d="M3 3 L3 33 L11 25 L16.5 37 L21.5 34.8 L16 23 L27 23 Z" fill="#fff" stroke="#14121b" stroke-width="2" stroke-linejoin="round"/></svg>';
  var p0={x:900,y:430},ps={x:se.x+240,y:sc.y},pq=q1?{x:q1.x+160,y:q1.y+q1.h/2}:ps,park={x:ai.x+ai.w-60,y:ai.y+ai.h+40},pb=bc,pt={x:tb.x+tb.w/2,y:tb.y+tb.h/2};
  cpath=[[24.0,p0],[24.9,ps],[26.6,ps],[27.05,pq],[27.6,pq],[28.4,park],[31.6,park],[32.75,pb],[33.6,pb],[34.75,pt],[37.4,pt]];
  [[24.95,ps],[27.1,pq],[32.85,pb],[34.85,pt]].forEach(function(c){var e=mk("div","ripple",null,pl);e.style.left=c[1].x+"px";e.style.top=c[1].y+"px";ripples.push({e:e,t:c[0]})});
  // Simple and Pro, side by side
  var du=$("duo");[["feed","SIMPLE","for beginners",500,20],["pro","PRO","for the full detail",1420,-20]].forEach(function(p,i){
    var pane=mk("div","pane",null,du),im=mk("img",null,null,pane);im.src=d.shots+p[0]+".png";pane.style.left=p[3]+"px";
    var tag=mk("div","tag",null,du);tag.style.left=p[3]+"px";mk("b",null,p[1],tag);mk("span",null,p[2],tag);
    duo[i]={pane:pane,tag:tag,ry:p[4]};
  });
  // end card
  var en=$("end");endEl.glow=mk("div","glow",null,en);endEl.logo=mk("img","logo",null,en);endEl.logo.src=d.logo;
  endEl.brand=mk("div","brand","PulsEdge",en);
  endEl.tl=mk("div","tl",null,en);endEl.tl.innerHTML="Indian market news, sorted for <em>the stocks you own.</em>";
  endEl.cta=mk("div","cta","Start your free 5-day trial · no card",en);
  endEl.url=mk("div","url","Free daily summary on Telegram · t.me/pulsedgein",en);
  endEl.fine=mk("div","fine","Educational information, not investment advice. PulsEdge never tells you to buy or sell.",en);
  // captions
  function cap(cls,a,b,html){var e=mk("div","cap "+cls,null,$("caps"));e.innerHTML=html;caps.push({e:e,a:a,b:b});return e}
  cap("top",.3,3.25,"<h1>Hundreds of market headlines hit<br>Indian stocks <em>every day.</em></h1>");
  cap("top",3.35,6.4,"<h1>Which ones matter for<br><em>the stocks you own?</em></h1>");
  cap("top",6.8,14.4,"<h1>PulsEdge reads every one<br>and gives it <em>a label.</em></h1>");
  cap("top",14.8,20.4,"<h1>Every label comes with the reason,<br><em>in plain English.</em></h1>");
  cap("mid",20.7,23.1,'<div class="k">HOW TO USE IT</div><h1>Three steps.</h1>');
  cap("side",23.5,31.4,'<div class="n">1</div><h2>Search a company you own</h2><p>You get a one-page brief: what happened, why it matters, what could go well or wrong.</p>');
  cap("side",31.7,37.5,'<div class="n">2</div><h2>Add it to My stocks</h2><p>Your My stocks tab then shows only news about the companies you own.</p>');
  cap("side",37.8,43.4,'<div class="n">3</div><h2>Stuck? Ask PulsEdge</h2><p>Ask about any company, sector or market word, in your own words.</p>');
  cap("top",43.8,48.1,"<h1>Start simple. <em>Switch to Pro any time.</em></h1>");
}

function camAt(t){
  if(t<=keys[0][0])return keys[0][1];
  for(var i=0;i<keys.length-1;i++){var a=keys[i],b=keys[i+1];if(t<=b[0]){var u=E(P(t,a[0],b[0])),o={};for(var k in a[1])o[k]=L(a[1][k],b[1][k],u);return o}}
  return keys[keys.length-1][1];
}
function curAt(t){
  if(t<=cpath[0][0])return cpath[0][1];
  for(var i=0;i<cpath.length-1;i++){var a=cpath[i],b=cpath[i+1];if(t<=b[0]){var u=E(P(t,a[0],b[0]));return {x:L(a[1].x,b[1].x,u),y:L(a[1].y,b[1].y,u)}}}
  return cpath[cpath.length-1][1];
}
function show(e,o,tf){e.style.opacity=o.toFixed(3);e.style.visibility=o>0.002?"visible":"hidden";if(tf!=null)e.style.transform=tf}

function render(t){
  // floor drifts forward the whole time
  $("floor").style.backgroundPosition="0 "+(t*70).toFixed(1)+"px";
  $("floorwrap").style.opacity=(.9-.5*win(t,22.4,44,.8)).toFixed(3);
  // A: stream
