<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PulsEdge routine hook, premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hanken+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--ink:#F2EDE3;--mute:#A9A3B5;--dim:#7B7688;--gold:#C9A86A;--gold2:#E2C98F;--line:#C9A86A55;--lav:#B9A6FF}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B0A0F}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:"Hanken Grotesk",sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:radial-gradient(60% 38% at 72% 34%,#3a2a6a66,transparent 70%),radial-gradient(70% 45% at 50% 50%,#17151d 0%,#0d0c11 60%,#08080b 100%)}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay}
.frame{position:absolute;left:56px;right:56px;top:300px;bottom:300px;border:1px solid var(--line)}
#brand{position:absolute;left:0;right:0;top:350px;text-align:center;font:600 26px/1 "Hanken Grotesk",sans-serif;letter-spacing:.42em;color:var(--gold)}
#brand span{color:var(--mute)}
.rule{position:absolute;left:50%;top:400px;width:120px;margin-left:-60px;height:1px;background:var(--gold)}
.l{position:absolute;left:96px;right:96px;text-align:center;font:600 112px/1.02 "Source Serif 4",Georgia,serif;letter-spacing:-.02em;opacity:0}
#a{top:470px}
#b{top:600px;font-size:230px;font-style:italic;font-weight:500;color:var(--gold2);letter-spacing:-.03em}
#c{top:850px}
#d{top:990px;font:500 58px/1.2 "Hanken Grotesk",sans-serif;color:var(--mute);letter-spacing:0}
.apps{position:absolute;left:0;right:0;top:1120px;display:flex;justify-content:center;gap:26px}
.apps i{display:block;width:104px;height:104px;border-radius:28px;border:2px solid #F2EDE355;opacity:0}
#x{position:absolute;left:190px;top:1170px;height:3px;width:0;background:var(--gold2);box-shadow:0 0 16px #E2C98F88}
#t{position:absolute;left:0;right:0;top:1320px;text-align:center;opacity:0}
#t span{display:inline-block;font:600 44px/1 "Hanken Grotesk",sans-serif;letter-spacing:.22em;color:var(--gold2);border:1.5px solid var(--gold);padding:26px 40px}
#foot{position:absolute;left:0;right:0;top:1640px;text-align:center;font:600 26px/1 "Hanken Grotesk",sans-serif;letter-spacing:.14em;color:var(--dim)}
#fade{position:absolute;inset:0;background:#0B0A0F;opacity:0}
</style></head><body><div id="s"><div class="bg"></div>
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
<div class="frame"></div><div id="brand">PULSEDGE <span>· THE 2-MINUTE ROUTINE</span></div><div class="rule"></div>
<div class="l" id="a">Still opening</div><div class="l" id="b">five apps</div><div class="l" id="c">every morning,</div><div class="l" id="d">before the market opens?</div>
<div class="apps"><i></i><i></i><i></i><i></i><i></i></div><div id="x"></div>
<div id="t"><span>DO THIS INSTEAD ↓</span></div>
<div id="foot">EDUCATIONAL INFORMATION ONLY · NOT INVESTMENT ADVICE</div><div id="fade"></div></div>
<script>
const C = { a: 0.02, b: 0.55, c: 1.15, d: 2.24, tiles: 0.75, strike: 3.15, t: 3.9, end: 5.1 };
const clamp=(x)=>Math.max(0,Math.min(1,x)),eo=(x)=>1-Math.pow(1-clamp(x),3);
function rise(el,at,t,dy){const p=(t-at)/0.45;el.style.opacity=clamp(p*2.2);el.style.transform=`translateY(${(1-eo(p))*(dy||36)}px)`}
function render(t){rise(a,C.a,t);rise(b,C.b,t,50);rise(c,C.c,t);rise(d,C.d,t,24);
 document.querySelectorAll(".apps i").forEach((e,i)=>{const p=(t-C.tiles-0.09*i)/0.3;e.style.opacity=clamp(p*2)*(t>C.strike+0.2?0.35:1);e.style.transform=`scale(${0.85+0.15*eo(p)})`});
 x.style.width=(700*eo((t-C.strike)/0.35))+"px";rise(document.getElementById("t"),C.t,t,20);
 fade.style.opacity=clamp((t-(C.end-0.12))/0.12)*0.6}
</script></body></html>
