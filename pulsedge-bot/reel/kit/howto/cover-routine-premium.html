<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PulsEdge routine cover, premium</title>
<!-- 1080x1920 reel cover. Key content inside the middle 1080x1350 (y 285..1635). Screen: real PulsEdge pre-market checklist, 27 Nov 2026. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hanken+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--ink:#F2EDE3;--mute:#A9A3B5;--dim:#7B7688;--gold:#C9A86A;--gold2:#E2C98F;--line:#C9A86A55}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B0A0F}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:"Hanken Grotesk",sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:radial-gradient(50% 30% at 50% 72%,#3a2a6a77,transparent 70%),radial-gradient(70% 45% at 50% 40%,#17151d 0%,#0d0c11 60%,#08080b 100%)}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay}
.frame{position:absolute;left:56px;right:56px;top:300px;bottom:300px;border:1px solid var(--line)}
.brand{position:absolute;left:0;right:0;top:350px;text-align:center;font:600 26px/1 "Hanken Grotesk",sans-serif;letter-spacing:.42em;color:var(--gold)}
.brand span{color:var(--mute)}
.rule{position:absolute;left:50%;top:400px;width:120px;margin-left:-60px;height:1px;background:var(--gold)}
.hd{position:absolute;left:80px;right:80px;top:440px;text-align:center;font:600 104px/1.0 "Source Serif 4",Georgia,serif;letter-spacing:-.02em}
.hd i{display:block;font-weight:500;font-size:150px;line-height:1.02;color:var(--gold2);letter-spacing:-.03em}
.phone{position:absolute;left:50%;top:900px;width:440px;height:600px;margin-left:-220px;border-radius:52px 52px 0 0;border:10px solid #1c1a22;border-bottom:none;overflow:hidden;background:#0b0a10;
  box-shadow:0 0 0 1px #C9A86A66,0 60px 140px -40px #6c43f0aa,0 30px 80px -20px #000}
.phone img{position:absolute;left:0;top:-110px;width:420px;height:auto}
.phone::after{content:"";position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(transparent,#0B0A0F)}
.tag{position:absolute;left:0;right:0;top:1520px;text-align:center;font:600 30px/1 "Hanken Grotesk",sans-serif;letter-spacing:.3em;color:var(--gold2)}
.tag b{display:block;width:72px;height:1px;background:var(--gold);margin:22px auto 0}
</style>
</head>
<body>
<div id="c">
  <div class="bg"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div class="frame"></div>
  <div class="brand">PULSEDGE <span>· THE 2-MINUTE ROUTINE</span></div>
  <div class="rule"></div>
  <div class="hd">Still opening<i>five apps</i>every morning?</div>
  <div class="phone"><img src="cap/pm.png" alt=""></div>
  <div class="tag">ONE SCREEN · TWO MINUTES<b></b></div>
</div>
</body>
</html>
