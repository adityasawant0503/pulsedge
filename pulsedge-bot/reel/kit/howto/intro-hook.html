<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PulsEdge routine hook</title>
<style>
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:PlexMono;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2");font-weight:600}
:root{--ink:#f6f5fb;--mute:#b3afc2;--dim:#77738a;--acc:#a58bff;--accl:#c9b8ff;--green:#2ee6a0}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#09080e}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:Plex,sans-serif;-webkit-font-smoothing:antialiased}
#glow{position:absolute;inset:-100px;background:radial-gradient(55% 35% at 70% 30%,#6c43f088,transparent 70%),radial-gradient(45% 30% at 15% 80%,#6c43f044,transparent 70%)}
#grid{position:absolute;inset:0;opacity:.3;background:linear-gradient(#ffffff10 1px,transparent 1px) 0 0/90px 90px,linear-gradient(90deg,#ffffff10 1px,transparent 1px) 0 0/90px 90px;-webkit-mask-image:radial-gradient(80% 60% at 50% 45%,#000 30%,transparent 85%)}
#brand{position:absolute;left:72px;top:250px;display:flex;align-items:center;gap:14px;font:600 30px/1 PlexMono,monospace;letter-spacing:.16em}
#brand span{width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px #a58bff2e,0 0 26px var(--acc)}
#brand em{font-style:normal;color:var(--mute);letter-spacing:.12em}
.l{position:absolute;left:72px;right:60px;font:700 132px/1 Plex,sans-serif;letter-spacing:-.05em;opacity:0}
#a{top:430px}#b{top:570px;font-size:260px;color:var(--accl);letter-spacing:-.06em}#c{top:850px}
.apps{position:absolute;left:72px;top:1040px;display:flex;gap:22px}
.apps i{display:block;width:120px;height:120px;border-radius:30px;border:4px solid #ffffff33;background:#ffffff10;opacity:0}
#x{position:absolute;left:60px;top:1000px;height:20px;width:0;background:#ff4d5e;border-radius:10px;transform:rotate(-6deg);box-shadow:0 0 40px #ff4d5e99}
#t{position:absolute;left:72px;top:1230px;display:inline-block;font:600 50px/1 PlexMono,monospace;letter-spacing:.1em;color:#1a1230;background:var(--accl);border-radius:16px;padding:22px 28px;opacity:0}
#foot{position:absolute;left:72px;right:72px;top:1586px;font:500 26px/1.3 Plex,sans-serif;color:var(--dim);text-align:center}
#flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
</style></head><body><div id="s"><div id="glow"></div><div id="grid"></div>
<div id="brand"><span></span>PULSEDGE <em>· 2-MIN ROUTINE</em></div>
<div class="l" id="a">Still checking</div><div class="l" id="b">5 apps</div><div class="l" id="c">before 9:15?</div>
<div class="apps"><i></i><i></i><i></i><i></i><i></i></div><div id="x"></div>
<div id="t">DO THIS INSTEAD ↓</div><div id="flash"></div>
<div id="foot">Educational information only · Not investment advice</div></div>
<script>
const clamp=(x)=>Math.max(0,Math.min(1,x)),eo=(x)=>1-Math.pow(1-clamp(x),3),back=(x)=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function pop(el,at,t,dy){const p=(t-at)/0.3;el.style.opacity=clamp(p*3);el.style.transform=`translateY(${(1-eo(p))*(dy||60)}px) scale(${0.85+0.15*back(p)})`}
function render(t){pop(a,0,t);pop(b,0.18,t,90);pop(c,0.42,t);
 document.querySelectorAll(".apps i").forEach((e,i)=>{const p=(t-0.6-0.08*i)/0.2;e.style.opacity=clamp(p*3)*(t>1.35?0.35:1);e.style.transform=`scale(${0.6+0.4*back(p)})`});
 x.style.width=(980*eo((t-1.2)/0.25))+"px";pop(document.getElementById("t"),1.45,t,40);
 let fl=0;[0.18,1.2].forEach(s=>{const d=t-s;if(d>=0&&d<0.2)fl=Math.max(fl,0.25*(1-d/0.2))});flash.style.opacity=fl;
 const out=clamp((t-2.05)/0.15);document.getElementById("s").style.opacity=1-out*0.0;}
</script></body></html>
