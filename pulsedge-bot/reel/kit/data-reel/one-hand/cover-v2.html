<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PulsEdge reel cover v2: buying and hedging</title>
<!-- 1080x1920 reel cover. Key content sits in the middle 1080x1350 (y 285..1635) so the profile-grid crop keeps it.
     Data: NSDL daily FPI investment 16–25 Nov 2026; NSE participant-wise OI, 25 Nov 2026 (FII index futures 23.8% long). -->
<style>
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:PlexMono;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Rupee;src:local("Inter Bold"),local("Inter-Bold"),local("Inter");unicode-range:U+20B9}
:root{--ink:#f6f5fb;--mute:#c4c0d2;--dim:#8c889b;--acc:#a58bff;--green:#2ee6a0;--red:#ff4d5e}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#07060b}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:Rupee,Plex,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:linear-gradient(90deg,#03251a 0%,#07130f 46%,#1d070c 54%,#2a0710 100%)}
.glowL{position:absolute;left:-200px;top:650px;width:900px;height:900px;background:radial-gradient(circle,#2ee6a055,transparent 62%)}
.glowR{position:absolute;right:-200px;top:650px;width:900px;height:900px;background:radial-gradient(circle,#ff4d5e55,transparent 62%)}
.grid{position:absolute;inset:0;opacity:.28;background:linear-gradient(#ffffff10 1px,transparent 1px) 0 0/90px 90px,linear-gradient(90deg,#ffffff10 1px,transparent 1px) 0 0/90px 90px;-webkit-mask-image:radial-gradient(80% 60% at 50% 50%,#000 30%,transparent 85%)}
.brand{position:absolute;left:0;right:0;top:318px;display:flex;justify-content:center;align-items:center;gap:14px;font:600 30px/1 PlexMono,monospace;letter-spacing:.16em}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px #a58bff33,0 0 24px var(--acc)}
.brand b{font-weight:600;color:var(--mute);letter-spacing:.12em}
.hd{position:absolute;left:0;right:0;top:392px;text-align:center;font:700 140px/1 Plex,sans-serif;letter-spacing:-.045em}
.hd .s{display:block;font-size:64px;letter-spacing:-.02em;color:var(--mute);margin-bottom:18px}
.hd u{text-decoration:none;color:#ffd36b}
.card{position:absolute;top:690px;width:452px;height:640px;border-radius:40px;padding:44px 38px;display:flex;flex-direction:column;align-items:center;text-align:center}
.card.l{left:60px;background:linear-gradient(180deg,#0b3b2b,#06201a);border:4px solid #2ee6a0aa;box-shadow:0 40px 120px -30px #2ee6a0aa}
.card.r{right:60px;background:linear-gradient(180deg,#45101a,#22070d);border:4px solid #ff4d5eaa;box-shadow:0 40px 120px -30px #ff4d5eaa}
.card .tag{font:600 32px/1 PlexMono,monospace;letter-spacing:.12em;padding:12px 18px;border-radius:12px}
.card.l .tag{background:var(--green);color:#00281a}
.card.r .tag{background:var(--red);color:#2a0007}
.card .ar{font:700 120px/1 Plex,sans-serif;margin-top:34px}
.card.l .ar{color:var(--green);text-shadow:0 0 50px #2ee6a0aa}
.card.r .ar{color:var(--red);text-shadow:0 0 50px #ff4d5eaa}
.card .big{font:700 118px/0.95 Plex,sans-serif;letter-spacing:-.05em;margin-top:24px;white-space:nowrap}
.card .big small{font-size:52px;letter-spacing:-.02em}
.card .lab{font:700 44px/1.12 Plex,sans-serif;letter-spacing:-.02em;margin-top:22px}
.card .sm{font:600 30px/1.25 PlexMono,monospace;color:var(--mute);margin-top:auto;letter-spacing:.04em}
.vs{position:absolute;left:50%;top:805px;width:132px;height:132px;margin-left:-66px;border-radius:50%;background:#f6f5fb;color:#07060b;display:flex;align-items:center;justify-content:center;font:700 52px/1 Plex,sans-serif;letter-spacing:-.02em;box-shadow:0 0 0 12px #07060b,0 20px 60px #000}
.cta{position:absolute;left:0;right:0;top:1440px;text-align:center}
.cta span{display:inline-flex;align-items:center;gap:18px;background:var(--ink);color:#07060b;font:700 56px/1 Plex,sans-serif;border-radius:999px;padding:30px 56px;box-shadow:0 20px 70px -10px #a58bffaa}
.cta span i{display:inline-block;width:0;height:0;border-left:30px solid #07060b;border-top:18px solid transparent;border-bottom:18px solid transparent}
</style>
</head>
<body>
<div id="c">
  <div class="bg"></div><div class="glowL"></div><div class="glowR"></div><div class="grid"></div>
  <div class="brand"><i></i>PULSEDGE <b>· MONEY MOVES</b></div>
  <div class="hd"><span class="s">Foreign investors are doing</span><u>BOTH.</u></div>
  <div class="card l">
    <span class="tag">CASH MARKET</span>
    <div class="ar">▲</div>
    <div class="big">₹58K<small> Cr</small></div>
    <div class="lab">bought in<br>7 sessions</div>
    <div class="sm">NSDL · 16–25 NOV</div>
  </div>
  <div class="card r">
    <span class="tag">FUTURES</span>
    <div class="ar">▼</div>
    <div class="big">3 in 4</div>
    <div class="lab">bets now<br>short</div>
    <div class="sm">NSE · 25 NOV</div>
  </div>
  <div class="vs">VS</div>
  <div class="cta"><span><i></i>Bullish or worried?</span></div>
</div>
</body>
</html>
