<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PulsEdge reel cover v3: editorial</title>
<!-- 1080x1920 reel cover, editorial palette: ink black, ivory, champagne gold, muted emerald and oxblood. Key content inside y 285..1635.
     Data: NSDL daily FPI investment 16–25 Nov 2026 (net ₹58,036 cr); NSE participant-wise OI 25 Nov 2026 (FII index futures 23.8% long, 76% short). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hanken+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--ink:#F2EDE3;--mute:#A59F94;--dim:#7B766D;--gold:#C9A86A;--gold2:#E2C98F;--em:#5FA383;--ox:#C26B6B;--line:#C9A86A55}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B0D}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);font-family:"Hanken Grotesk",sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 42%,#1B1A1F 0%,#0E0E11 60%,#08080A 100%)}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
.frame{position:absolute;left:56px;right:56px;top:300px;bottom:300px;border:1px solid var(--line)}
.top{position:absolute;left:0;right:0;top:350px;text-align:center;font:600 26px/1 "Hanken Grotesk",sans-serif;letter-spacing:.42em;color:var(--gold)}
.top span{color:var(--mute)}
.rule{position:absolute;left:50%;width:120px;margin-left:-60px;height:1px;background:var(--gold)}
.hd{position:absolute;left:96px;right:96px;top:450px;font:600 118px/1.02 "Source Serif 4",Georgia,serif;letter-spacing:-.02em;text-align:center}
.hd i{font-style:italic;font-weight:500;color:var(--gold2)}
.cols{position:absolute;left:96px;right:96px;top:1010px;display:grid;grid-template-columns:1fr 1px 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cols .sep{background:var(--line)}
.col{padding:40px 22px 38px;text-align:center}
.col .k{font:600 24px/1.2 "Hanken Grotesk",sans-serif;letter-spacing:.24em;color:var(--mute)}
.col .n{font:600 104px/1 "Source Serif 4",Georgia,serif;letter-spacing:-.02em;margin-top:22px;white-space:nowrap}
.col .n small{font-size:52px;letter-spacing:0;margin-left:6px}
.col .s{font:500 32px/1.3 "Hanken Grotesk",sans-serif;color:var(--mute);margin-top:16px}
.col.l .n{color:var(--em)}
.col.r .n{color:var(--ox)}
.q{position:absolute;left:0;right:0;top:1420px;text-align:center;font:italic 500 58px/1.1 "Source Serif 4",Georgia,serif;color:var(--ink)}
.q b{display:block;width:72px;height:1px;background:var(--gold);margin:30px auto 0}
.src{position:absolute;left:0;right:0;top:1560px;text-align:center;font:600 22px/1 "Hanken Grotesk",sans-serif;letter-spacing:.2em;color:var(--dim)}
</style>
</head>
<body>
<div id="c">
  <div class="bg"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div class="frame"></div>
  <div class="top">PULSEDGE <span>· MONEY MOVES</span></div>
  <div class="rule" style="top:400px"></div>
  <div class="hd">Buying with<br>one hand.<br><i>Hedging with<br>the other.</i></div>
  <div class="cols">
    <div class="col l"><div class="k">CASH · 16–25 NOV</div><div class="n">₹58,036<small>Cr</small></div><div class="s">net bought by<br>foreign investors</div></div>
    <div class="sep"></div>
    <div class="col r"><div class="k">FUTURES · 25 NOV</div><div class="n">76%</div><div class="s">of their index<br>bets are short</div></div>
  </div>
  <div class="q">Conviction, or caution?<b></b></div>
  <div class="src">NSDL · NSE · EDUCATIONAL ONLY</div>
</div>
</body>
</html>
